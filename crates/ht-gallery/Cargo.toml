[package]
name = "ht-gallery"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
wgpu = "0.19"
winit = "0.29"
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# For timing and animations
instant = "0.1"

# For UUID generation
uuid = { version = "1.6", features = ["v4"] }

# For texture packing
rect_packer = "0.2"

[dev-dependencies]
